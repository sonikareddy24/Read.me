<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07050e"/>
      <stop offset="55%" stop-color="#120826"/>
      <stop offset="70%" stop-color="#240b4f"/>
      <stop offset="72%" stop-color="#6b21a8"/>
      <stop offset="74%" stop-color="#a855f7"/>
      <stop offset="76%" stop-color="#190938"/>
      <stop offset="100%" stop-color="#0a0517"/>
    </linearGradient>

    <!-- Floor Perspective Gradient -->
    <linearGradient id="floorFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#7e22ce" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circuit Trace Pattern -->
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Ambient Cyber Orbs -->
  <circle cx="200" cy="140" r="160" fill="#7c3aed" opacity="0.12" filter="url(#neonGlow)" />
  <circle cx="1000" cy="120" r="180" fill="#9333ea" opacity="0.1" filter="url(#neonGlow)" />
  <circle cx="600" cy="280" r="240" fill="#a855f7" opacity="0.15" filter="url(#neonGlow)" />

  <!-- Background Circuit & Data Traces (Inspired by Reference 1) -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none" opacity="0.65">
    <!-- Left Circuit Lines -->
    <path d="M 80,310 L 80,180 L 140,180 L 140,90 L 220,90" />
    <path d="M 160,310 L 160,220 L 240,220 L 240,140 L 320,140" />
    <path d="M 280,310 L 280,240 L 360,240 L 360,110 L 400,110" />
    <path d="M 40,260 L 110,260 L 110,130 L 180,130" />

    <!-- Right Circuit Lines -->
    <path d="M 1120,310 L 1120,170 L 1050,170 L 1050,100 L 980,100" />
    <path d="M 1040,310 L 1040,210 L 960,210 L 960,130 L 880,130" />
    <path d="M 920,310 L 920,250 L 840,250 L 840,150 L 800,150" />
    <path d="M 1160,250 L 1090,250 L 1090,120 L 1020,120" />
  </g>

  <!-- Glowing Terminal Nodes on Circuit Traces -->
  <g fill="#c084fc" filter="url(#softGlow)">
    <circle cx="220" cy="90" r="3.5" />
    <circle cx="320" cy="140" r="3" />
    <circle cx="400" cy="110" r="3.5" />
    <circle cx="180" cy="130" r="2.5" />
    <circle cx="980" cy="100" r="3.5" />
    <circle cx="880" cy="130" r="3" />
    <circle cx="800" cy="150" r="3.5" />
    <circle cx="1020" cy="120" r="2.5" />
  </g>

  <!-- Perspective Cyber Grid Floor (Replicating Reference 1) -->
  <g opacity="0.85">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="310" x2="1200" y2="310" stroke="#f3e8ff" stroke-width="2" filter="url(#softGlow)"/>
    <line x1="0" y1="314" x2="1200" y2="314" stroke="#c084fc" stroke-width="1.8" opacity="0.9"/>
    <line x1="0" y1="322" x2="1200" y2="322" stroke="#a855f7" stroke-width="1.6" opacity="0.8"/>
    <line x1="0" y1="334" x2="1200" y2="334" stroke="#9333ea" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#7e22ce" stroke-width="1.4" opacity="0.6"/>
    <line x1="0" y1="372" x2="1200" y2="372" stroke="#6b21a8" stroke-width="1.3" opacity="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#581c87" stroke-width="1.2" opacity="0.35"/>

    <!-- Perspective Rays Radiating from Horizon Center (600, 310) -->
    <g stroke="url(#floorFade)" stroke-width="1.4">
      <line x1="600" y1="310" x2="600" y2="420" />
      <line x1="600" y1="310" x2="520" y2="420" />
      <line x1="600" y1="310" x2="680" y2="420" />
      <line x1="600" y1="310" x2="430" y2="420" />
      <line x1="600" y1="310" x2="770" y2="420" />
      <line x1="600" y1="310" x2="330" y2="420" />
      <line x1="600" y1="310" x2="870" y2="420" />
      <line x1="600" y1="310" x2="210" y2="420" />
      <line x1="600" y1="310" x2="990" y2="420" />
      <line x1="600" y1="310" x2="80" y2="420" />
      <line x1="600" y1="310" x2="1120" y2="420" />
      <line x1="600" y1="310" x2="-60" y2="420" />
      <line x1="600" y1="310" x2="1260" y2="420" />
      <line x1="600" y1="310" x2="-220" y2="420" />
      <line x1="600" y1="310" x2="1420" y2="420" />
    </g>
  </g>

  <!-- Horizon Core Bright Flare -->
  <line x1="300" y1="310" x2="900" y2="310" stroke="#ffffff" stroke-width="2.5" filter="url(#neonGlow)" />
  <line x1="450" y1="310" x2="750" y2="310" stroke="#ffffff" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Center Typography & Branding -->
  <g text-anchor="middle">
    <!-- Top System Tag -->
    <rect x="475" y="65" width="250" height="26" rx="13" fill="#1e1035" stroke="#7c3aed" stroke-width="1.2" opacity="0.9"/>
    <text x="600" y="82" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="3.5">SYSTEM // ONLINE</text>

    <!-- Main Name Title -->
    <text x="600" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="58" font-weight="900" letter-spacing="14" filter="url(#softGlow)">SONIKA REDDY</text>
    <text x="600" y="165" fill="#f5f3ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', sans-serif" font-size="58" font-weight="900" letter-spacing="14">SONIKA REDDY</text>

    <!-- Subtitle Tagline -->
    <text x="600" y="215" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="16" font-weight="600" letter-spacing="6">ENGINEERING INTELLIGENCE • BUILDING POSSIBILITIES</text>

    <!-- Status Badges Row -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="500">
      <rect x="360" y="248" width="140" height="24" rx="6" fill="#130924" stroke="#4c1d95" stroke-width="1" />
      <text x="430" y="264" fill="#a78bfa" letter-spacing="1">AI / ML SYSTEMS</text>

      <rect x="520" y="248" width="160" height="24" rx="6" fill="#130924" stroke="#6d28d9" stroke-width="1" />
      <text x="600" y="264" fill="#c084fc" letter-spacing="1">NEURAL COMPILERS</text>

      <rect x="700" y="248" width="140" height="24" rx="6" fill="#130924" stroke="#4c1d95" stroke-width="1" />
      <text x="770" y="264" fill="#a78bfa" letter-spacing="1">EVIDENCE AI</text>
    </g>
  </g>

  <!-- Glowing Particles / Sparks -->
  <g fill="#e9d5ff" opacity="0.75" filter="url(#softGlow)">
    <circle cx="580" cy="295" r="1.5" />
    <circle cx="630" cy="285" r="2" />
    <circle cx="490" cy="302" r="1.2" />
    <circle cx="720" cy="298" r="1.8" />
    <circle cx="380" cy="290" r="1.5" />
    <circle cx="830" cy="292" r="1.2" />
  </g>
</svg>
